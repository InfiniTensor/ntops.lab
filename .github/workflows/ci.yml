name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_gpu_validation:
        description: "Run GPU operator validation on a self-hosted CUDA runner"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      operator_filter:
        description: "Optional pytest -k expression for GPU validation"
        required: false
        default: ""

jobs:
  unit-tests:
    name: Unit and metadata tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest suite
        run: python -m pytest

  gpu-operator-validation:
    name: Optional GPU operator validation
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_gpu_validation == 'true'
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gpu]"

      - name: Run GPU operator validation
        env:
          OPERATOR_FILTER: ${{ github.event.inputs.operator_filter }}
        run: |
          if [ -n "$OPERATOR_FILTER" ]; then
            NTOPS_RUN_OPERATOR_VALIDATION=1 python -m pytest tests/test_operator_gpu_validation.py -k "$OPERATOR_FILTER"
          else
            NTOPS_RUN_OPERATOR_VALIDATION=1 python -m pytest tests/test_operator_gpu_validation.py
          fi
